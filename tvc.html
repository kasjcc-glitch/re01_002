<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TVC广告 - Jcc作品集</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #2563eb; --primary-light: #3b82f6; --primary-dark: #1d4ed8;
            --accent: #06b6d4; --text-main: #1e293b; --text-secondary: #64748b;
            --text-muted: #94a3b8; --bg-main: #f8fafc; --bg-card: #ffffff;
            --border: #e2e8f0;
            --shadow: 0 4px 6px -1px rgba(0,0,0,0.07), 0 2px 4px -2px rgba(0,0,0,0.05);
            --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.08), 0 4px 6px -4px rgba(0,0,0,0.05);
            --radius: 12px;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Helvetica, Arial, sans-serif;
            background-color: var(--bg-main); color: var(--text-main); line-height: 1.7;
            min-height: 100vh; position: relative; overflow-x: hidden;
        }
        .bg-decoration {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: -1; overflow: hidden;
        }
        .bg-decoration::before {
            content: ''; position: absolute; top: -20%; right: -10%;
            width: 600px; height: 600px;
            background: radial-gradient(circle, rgba(37,99,235,0.08) 0%, transparent 70%);
            border-radius: 50%; animation: float 20s ease-in-out infinite;
        }
        .bg-decoration::after {
            content: ''; position: absolute; bottom: -15%; left: -5%;
            width: 500px; height: 500px;
            background: radial-gradient(circle, rgba(6,182,212,0.06) 0%, transparent 70%);
            border-radius: 50%; animation: float 25s ease-in-out infinite reverse;
        }
        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -30px) scale(1.05); }
            66% { transform: translate(-20px, 20px) scale(0.95); }
        }
        header {
            background: rgba(255,255,255,0.85); backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--border);
            padding: 0 24px; height: 64px; display: flex; align-items: center;
            justify-content: space-between; position: sticky; top: 0; z-index: 100;
        }
        .logo {
            font-size: 20px; font-weight: 700;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text; letter-spacing: -0.5px;
        }
        nav { display: flex; gap: 8px; align-items: center; }
        nav a {
            text-decoration: none; color: var(--text-secondary); font-size: 14px;
            font-weight: 500; padding: 8px 16px; border-radius: 8px; transition: all 0.2s;
        }
        nav a:hover, nav a.active { color: var(--primary); background: rgba(37,99,235,0.08); }
        .clock { font-size: 13px; color: var(--text-muted); font-variant-numeric: tabular-nums; }
        .container { max-width: 1200px; margin: 0 auto; padding: 32px 24px 60px; }
        .page-title { text-align: center; margin-bottom: 50px; }
        .page-title h1 {
            font-size: 2.5rem;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; display: inline-block;
        }

        /* 作品卡片（外链） */
        .video-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 30px; }
        .work-card {
            display: block; text-decoration: none; color: inherit;
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: var(--radius); overflow: hidden; cursor: pointer;
            box-shadow: var(--shadow); transition: all 0.3s;
        }
        .work-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); border-color: var(--primary); }
        .thumb { position: relative; width: 100%; padding-top: 56.25%; background: #0b1220; overflow: hidden; }
        .thumb img {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover; opacity: 0.85; transition: 0.3s;
        }
        .work-card:hover .thumb img { opacity: 1; transform: scale(1.05); }
        .play-btn {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%); width: 60px; height: 60px;
            background: rgba(37,99,235,0.9); border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            transition: 0.3s; z-index: 2;
        }
        .play-btn::after {
            content: ''; border-style: solid; border-width: 10px 0 10px 18px;
            border-color: transparent transparent transparent white; margin-left: 4px;
        }
        .work-card:hover .play-btn { transform: translate(-50%, -50%) scale(1.1); background: var(--primary); }
        .info { padding: 18px 20px; }
        .info h3 { font-size: 16px; font-weight: 600; color: var(--text-main); margin-bottom: 4px; }
        .info .link-hint { font-size: 13px; color: var(--primary); font-weight: 500; }

        .nav-buttons { display: flex; gap: 12px; margin-top: 40px; }
        .btn {
            display: inline-flex; align-items: center; gap: 6px; text-decoration: none;
            padding: 10px 22px; border-radius: 8px; font-size: 14px; font-weight: 500;
            transition: all 0.2s; border: none; cursor: pointer;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: white; box-shadow: 0 4px 12px rgba(37,99,235,0.3);
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(37,99,235,0.4); }
        .btn-outline { background: transparent; color: var(--primary); border: 1.5px solid var(--primary); }
        .btn-outline:hover { background: rgba(37,99,235,0.06); transform: translateY(-2px); }
        footer { text-align: center; padding: 24px; color: var(--text-muted); font-size: 13px; border-top: 1px solid var(--border); margin-top: 20px; }
        @media (max-width: 640px) {
            header { padding: 0 16px; } .container { padding: 24px 16px 48px; }
            .video-grid { grid-template-columns: 1fr; }
            .nav-buttons { flex-direction: column; } .btn { justify-content: center; }
        }
    </style>
</head>
<body>
<div class="bg-decoration"></div>
<header>
    <span class="logo">Jcc</span>
    <nav>
        <a href="index.html">主页</a>
        <a href="projects.html" class="active">项目展示</a>
        <a href="contact.html">联系我</a>
    </nav>
    <span class="clock" id="clock">--:--:--</span>
</header>
<div class="container">
    <div class="page-title"><h1>TVC广告</h1></div>
    <div class="video-grid">

        <a class="work-card" href="https://www.xinpianchang.com/a13831814" target="_blank" rel="noopener">
            <div class="thumb">
                <img src="assets/Snipaste_2026-09-29_19-20-55.png" alt="红旗广告">
                <div class="play-btn"></div>
            </div>
            <div class="info">
                <h3>红旗广告</h3>
                <span class="link-hint">在新片场查看 →</span>
            </div>
        </a>

        <a class="work-card" href="https://www.xinpianchang.com/a13831816" target="_blank" rel="noopener">
            <div class="thumb">
                <img src="assets/Snipaste_2026-09-29_19-22-45.png" alt="环保广告">
                <div class="play-btn"></div>
            </div>
            <div class="info">
                <h3>环保广告</h3>
                <span class="link-hint">在新片场查看 →</span>
            </div>
        </a>

    </div>
    <div class="nav-buttons">
        <a href="projects.html" class="btn btn-outline">← 项目列表</a>
        <a href="contact.html" class="btn btn-primary">联系我 →</a>
    </div>
</div>
<footer>Jcc Portfolio &copy; 2026</footer>
<script>
    setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleTimeString(); }, 1000);
</script>
</body>
</html>
